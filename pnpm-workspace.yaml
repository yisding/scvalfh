allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # workerd (the Workers runtime, via @cloudflare/vite-plugin -> miniflare) runs `node install.js`
  # to check its platform binary; `pnpm preview:cloudflare` runs the Worker in it.
  workerd: true
# The Workers target runs on pre-release Cloudflare tooling, pinned exactly in package.json:
# @cloudflare/vite-plugin 2.0.0-beta.sha-ad79608dd (the `beta` dist-tag; the 1.x `latest` line is
# wrangler-based and does not read cloudflare.config.ts) and cf 1.0.0-beta.6, what `vinext init
# --platform=cloudflare` installs (@cloudflare/vite-plugin@beta, cf@latest). cf beta.6 is the
# release built on the same internals as that plugin build (miniflare 5.20260926.0-alpha,
# @cloudflare/config 0.20.0, build-output-utils 0.8.2, runtime-types 0.1.4); later cf betas move
# all four, so bump the two together and re-run the Workers build, preview and `--dry-run` deploy.
# cloudflare.config.ts's compatibilityDate follows the workerd the plugin bundles. The lockfile
# pins the tarballs' integrity; if npm ever drops a sha-tagged build, move to the next `beta`.
# The two patches under patchedDependencies (eleven vinext 1.0.0 gaps, one @vinext/cloudflare 1.0.0
# gap) are listed and explained in docs/VINEXT-PATCHES.md "The vinext patch".
# Security backports the resolved versions do not reach on their own (`pnpm audit` is clean with
# these; drop each once the dependant moves past the vulnerable range):
#  - satori (next/og's renderer, via vinext -> @vercel/og) pins fflate 0.7.3 exactly;
#    GHSA-px8p-9vwx-vf98 (unzipSync infinite loop on malformed ZIP64) is fixed in 0.7.5, the
#    backport on the 0.7 line, and satori does not call unzipSync, so the override is API-neutral.
#  - miniflare 5.20260926.0-alpha (the Workers runtime `vite preview --mode cloudflare` and
#    `cf deploy` run) pins undici 7.29.0 exactly; eleven advisories on it, two high
#    (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3), are fixed in 7.29.1, a patch release. undici is
#    dev-time only here (the deployed Worker uses workerd's own fetch), but Sourcery blocks the PR
#    on it.
overrides:
  'fflate@<0.7.5': 0.7.5
  'undici@<7.29.1': 7.29.1
patchedDependencies:
  '@vinext/cloudflare@1.0.0': patches/@vinext__cloudflare@1.0.0.patch
  vinext@1.0.0: patches/vinext@1.0.0.patch
