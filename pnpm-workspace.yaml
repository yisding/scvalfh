allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # workerd (the Workers runtime, via @cloudflare/vite-plugin -> miniflare) runs `node install.js`
  # to check its platform binary; `pnpm preview:cloudflare` runs the Worker in it.
  workerd: true
# The Workers target runs on pre-release Cloudflare tooling, pinned exactly in package.json:
# @cloudflare/vite-plugin 2.0.0-beta.sha-ad79608dd (the `beta` dist-tag; the 1.x `latest` line is
# wrangler-based and does not read cloudflare.config.ts) and cf 1.0.0-beta.6, what `vinext init
# --platform=cloudflare` installs (@cloudflare/vite-plugin@beta, cf@latest). cf beta.6 is the
# release built on the same internals as that plugin build (miniflare 5.20260926.0-alpha,
# @cloudflare/config 0.20.0, build-output-utils 0.8.2, runtime-types 0.1.4); later cf betas move
# all four, so bump the two together and re-run the Workers build, preview and `--dry-run` deploy.
# cloudflare.config.ts's compatibilityDate follows the workerd the plugin bundles. The lockfile
# pins the tarballs' integrity; if npm ever drops a sha-tagged build, move to the next `beta`.
# Eight vinext 1.4.5 gaps and one @vinext/cloudflare 1.3.4 gap, each fixed where it lives (see the
# comments inside the two patches and README "The vinext patch"); drop each patch once upstream
# ships all of its fixes. Ported from the 1.0.0 patches on 2026-11-10; what 1.4.5 fixed upstream
# (the nested-group header source, the no-store header on a 404 rendered on request, the root
# not-found for a `dynamicParams = false` miss, static Route Handlers reading the cache) was
# dropped then.
#  - `notFound()` in a metadata route (the per-game/date/team OG images) was a 500, not a 404;
#  - a page whose prerender ended in notFound() (the field-hockey-only pages of a soccer or
#    basketball build) is stored with its 404 and served from the cache, where the headers() rule
#    replaced its policy, so that 404 went out cacheable; it gets Next's never-cache header
#    (server/app-page-cache.js, server/app-rsc-response-finalizer.js);
#  - the prerender read a next.config headers() Cache-Control rule back as the page's ISR lifetime,
#    so a rule with `s-maxage` re-rendered every "static" page at request time; Next keeps them
#    `revalidate: false` (dormant under today's `max-age=0, must-revalidate` rule);
#  - pages served from the cache carried no ETag, so revalidation never got a 304 (Next sends one;
#    like Next, cached metadata route and Route Handler bodies get none), on the Node server
#    (server/prod-server.js) and on Workers (server/app-router-entry.js);
#  - metadata routes (unless `"use cache"`) and static GET Route Handlers were never prerendered,
#    so the icons, every OG image, manifest, sitemap and robots rendered per request; `next build`
#    prerenders all of them (build/prerender.js, server/metadata-route-response.js,
#    server/seed-cache.js);
#  - vinext refused every build without the cloudflare() plugin whenever cloudflare.config.ts
#    exists, so `pnpm build:vinext` (Node) could not run beside the Workers target; a Vite config
#    that imports and calls cloudflare() (the text scan `vinext-cloudflare deploy` uses) now
#    chooses per build, except under `vinext-cloudflare deploy`, which must build for Workers
#    (`--env cloudflare`) or `cf deploy` would upload a stale build (index.js);
#  - vinext's generated .assetsignore listed only `.vite`, so Workers Static Assets served the
#    build-only vinext-client-entry-manifest.json publicly; it is listed too (index.js);
#  - a Cloudflare build's prerender, which runs the Worker bundle in Node, could not import
#    next/og's .wasm the workerd way and died on the first OG image or icon
#    (build/prerender-cloudflare-loader.js);
#  - @vinext/cloudflare's staticAssetsAdapter packaged prerendered pages and metadata routes but
#    not Route Handlers, so the Worker rendered /icon-192 and /icon-512 per request
#    (patches/@vinext__cloudflare@1.3.4.patch, dist/cache/static-assets-adapter.build.js).
# Security backports the resolved versions do not reach on their own (`pnpm audit` is clean with
# these; drop each once the dependant moves past the vulnerable range):
#  - satori (next/og's renderer, via vinext -> @vercel/og) pins fflate 0.7.3 exactly;
#    GHSA-px8p-9vwx-vf98 (unzipSync infinite loop on malformed ZIP64) is fixed in 0.7.5, the
#    backport on the 0.7 line, and satori does not call unzipSync, so the override is API-neutral.
#  - miniflare 5.20260926.0-alpha (the Workers runtime `vite preview --mode cloudflare` and
#    `cf deploy` run) pins undici 7.29.0 exactly; eleven advisories on it, two high
#    (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3), are fixed in 7.29.1, and ten more on 7.29.1, four
#    high (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm), in
#    7.30.1, the version later miniflare builds pin. undici is dev-time only here (the deployed
#    Worker uses workerd's own fetch), but Sourcery blocks the PR on it.
#  - that miniflare also pins sharp 0.35.4 (GHSA-wq5f-xc86-pv6w, high, fixed in 0.35.5, a patch
#    release and the version the site itself depends on).
#  - @cloudflare/config 0.20.0 (cloudflare.config.ts's schema, via cf and the Vite plugin) pins zod
#    4.4.3 (GHSA-mrhx-c7xc-m3w5, high, fixed in 4.6.6); it shares the site's own zod.
#  - typescript-eslint (via eslint-config-next) takes minimatch 10 (GHSA-g3hv-75wg-m249, moderate:
#    a slow match on a crafted glob), fixed only on the 11 line. Lint-time only, on this repo's own
#    globs; `pnpm lint` and tests/lint-boundaries.test.ts pass on it.
minimumReleaseAgeExclude:
  - '@vinext/cloudflare@1.3.4'
  - vinext@1.4.5
overrides:
  'fflate@<0.7.5': 0.7.5
  'minimatch@>=10.0.0 <11.0.1': 11.0.5
  'sharp@<0.35.5': 0.35.5
  'undici@<7.30.1': 7.30.1
  'zod@>=4.0.0 <4.6.6': 4.6.7
patchedDependencies:
  '@vinext/cloudflare@1.3.4': patches/@vinext__cloudflare@1.3.4.patch
  vinext@1.4.5: patches/vinext@1.4.5.patch
