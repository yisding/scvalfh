# axe-core and a Chromium for scripts/a11y-axe.mjs, shared by the a11y, vinext and cloudflare jobs in ci.yml.
#
# Not repo dependencies: they are needed by CI, not by the site, and the BUILD-BRIEF's
# no-new-dependency rule is about what ships. They go in a directory of their own, not the
# checkout: npm cannot install into the symlinked tree pnpm wrote (npm 10 and 11 both abort with
# "Cannot read properties of null (reading 'matches')"), and a reshaped node_modules could change
# what the server runs — under the vinext job it could swap the patched vinext for a stock one.
# The axe script resolves both packages with require(), which honours NODE_PATH; writing it to
# GITHUB_ENV exports it to every later step of the calling job.
name: Install axe-core and Chromium
description: Installs axe-core and Playwright Chromium outside the checkout and exports NODE_PATH for scripts/a11y-axe.mjs.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/axe"
        cd "$RUNNER_TEMP/axe"
        npm init -y >/dev/null
        # axe-core is pinned to the 4.13 line. 4.14.0 (published 2026-10-05) widened
        # label-content-name-mismatch: it now compares the visible text of aria-hidden descendants and
        # keeps the soft hyphens of the picker tiles (lib/pin-label.ts PICKER_BREAKS), so it flags the
        # home pin tiles, the "who we haven't beaten" rows and the pinned card's last-game link, all of
        # whose names are deliberate sentences (DESIGN §7.12, §10). Those three patterns are a
        # follow-up (README "Known limitations"); until they are reworked, 4.14 would fail this job on
        # main and on every branch alike, for reasons no change introduced.
        npm install --no-save --no-audit --no-fund axe-core@4.13 playwright
        npx playwright install --with-deps chromium
        echo "NODE_PATH=$RUNNER_TEMP/axe/node_modules" >> "$GITHUB_ENV"
