# The girls soccer site's data refresh (SCVAL_SPORT=soccer; docs/MULTI-SPORT.md): update-data.yml's job
# for data/soccer/, narrowed to what the soccer build reads. It fetches the snapshot (MaxPreps, the
# bundled official SCVAL fixtures, the CCS calendar and cifsshome.org; si.com and the VNN school calendars
# are field hockey's sources), then the player stats, the JV games and the varsity and JV rosters, tests
# them, and commits data/soccer/snapshot.json, its meta file, data/soccer/player-stats.json,
# data/soccer/jv.json, data/soccer/rosters.json and data/soccer/jv-rosters.json only where the CONTENT
# changed (the same contentHash rule as update-data.yml).
#
# Schedule: half an hour after each field hockey run (5:30 and 14:30 UTC, 10:30 PM and 7:30 AM Pacific
# during PDT), in the soccer season's months. The scripts' own guard is the soccer season window
# (lib/league-config/soccer/sections.ts: Nov 1 – Mar 10 Pacific; lib/pipeline/steps/window.ts), so a run
# outside it writes nothing. UTC is never behind Pacific, so the November and March edges need no extra
# month: the earliest Pacific-November instant is already November in UTC, and a Pacific Mar 10 evening
# run is still March in UTC.
#
# Both refreshes share the `update-data` concurrency group, so they never push at the same time, and each
# rebases before it pushes. The commit messages start "data: refresh soccer", which deploy-cloudflare.yml
# accepts as a data commit, so a soccer refresh never holds back field hockey's Worker deploy
# (tests/workflows.test.ts holds the files and messages to the gate). The push is what makes Vercel
# rebuild the soccer project (soccer.ncfh.net); the field hockey project skips a build that touched only
# data/soccer/ (scripts/vercel-ignore-build.sh).

name: update-data-soccer

on:
  schedule:
    - cron: '30 14 * 1-3,11-12 *'
    - cron: '30 5 * 1-3,11-12 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside the Nov 1 - Mar 10 soccer season window'
        type: boolean
        default: false

permissions:
  contents: write

# Shared with update-data.yml: one refresh at a time on main, whichever sport.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 15 schedule feeds and two league tables, the official revision checks, the CCS calendar and the
    # cifsshome.org listings; then 15 stats rollups and 15 JV feeds. Far less than field hockey's run.
    timeout-minutes: 30

    env:
      SCVAL_SPORT: soccer

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # pnpm BEFORE setup-node (see update-data.yml).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exit 1 only on a run abort (nothing written, the previous snapshot stays). The official SCVAL
      # fixtures are bundled (data/soccer/official/), so no pdftotext is needed.
      - name: Fetch data
        timeout-minutes: 15
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: |
          set -euo pipefail
          args=(--no-sblive --no-vnn)
          [ -n "$FORCE" ] && args+=(--force)
          pnpm fetch-data "${args[@]}"

      # Never fatal, as in update-data.yml: a stats outage must not cost the day's scores.
      - name: Fetch player stats
        id: stats
        continue-on-error: true
        timeout-minutes: 10
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$FORCE" ] && args+=(--force)
          pnpm fetch-player-stats "${args[@]}"

      # Never fatal either. MaxPreps' JV feeds only: the soccer build reads no si.com page.
      - name: Fetch JV games
        id: jv
        continue-on-error: true
        timeout-minutes: 10
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: |
          set -euo pipefail
          args=(--no-sblive)
          [ -n "$FORCE" ] && args+=(--force)
          pnpm fetch-jv "${args[@]}"

      # Never fatal. The varsity and JV roster pages (maxpreps.com/…/roster/ and …/jv/roster/): coaches post
      # them in the first weeks of the season and edit them rarely, and nothing else re-reads them, so without
      # this a roster posted after the site was set up would never appear. Each script leaves its file alone
      # when nothing but its stamps would change, and keeps a team's previous rows when its page fails.
      - name: Fetch rosters
        id: rosters
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -uo pipefail
          # Each script exits 1 when any team's page failed (it still writes its file, keeping that team's
          # previous rows), so the JV pages are read whatever the varsity run said.
          rc=0
          pnpm fetch-rosters || rc=1
          pnpm fetch-rosters --level jv || rc=1
          exit "$rc"

      # tests/soccer.test.ts loads every soccer data file through its validating loader, and tests/jv-hub.test.ts
      # (which reads the job's SCVAL_SPORT) holds the JV pages to the JV games just fetched. When they fail
      # and the stats or JV file changed in this run, both go back to the committed ones and it runs
      # again, so only a bad snapshot blocks the commit.
      - name: Test
        id: test
        run: |
          set -uo pipefail
          run() { pnpm exec vitest run tests/soccer.test.ts tests/jv-hub.test.ts; }
          if run; then exit 0; fi
          if git diff --quiet -- data/soccer/player-stats.json data/soccer/jv.json data/soccer/rosters.json data/soccer/jv-rosters.json; then
            echo "::error::tests/soccer.test.ts failed and neither the soccer stats nor the soccer JV file changed in this run"
            exit 1
          fi
          echo "::warning::tests/soccer.test.ts failed; testing again with the committed stats and JV files"
          git checkout -- data/soccer/player-stats.json data/soccer/jv.json data/soccer/rosters.json data/soccer/jv-rosters.json
          echo "restored=true" >> "$GITHUB_OUTPUT"
          run

      - name: Commit the data that changed
        id: commit
        run: |
          set -euo pipefail
          # The snapshot changed when its contentHash did (update-data.yml explains why a plain diff
          # never is quiet).
          PREV="${RUNNER_TEMP:-/tmp}/previous-soccer-meta.json"
          git show HEAD:data/soccer/snapshot.meta.json > "$PREV" 2>/dev/null || true
          SNAPSHOT=$(node -e '
            const fs = require("node:fs");
            const hashOf = (p) => {
              try { return JSON.parse(fs.readFileSync(p, "utf8")).contentHash ?? null; }
              catch { return null; }
            };
            const next = hashOf("data/soccer/snapshot.meta.json");
            const prev = hashOf(process.argv[1]);
            process.stdout.write(next === null || prev === null || next !== prev ? "true" : "false");
          ' "$PREV")
          if [ "$SNAPSHOT" != "true" ]; then
            echo "no snapshot change — only the run timestamp moved"
            git checkout -- data/soccer/snapshot.json data/soccer/snapshot.meta.json
          fi
          if git diff --quiet -- data/soccer/player-stats.json; then STATS=false; else STATS=true; fi
          if git diff --quiet -- data/soccer/jv.json; then JV=false; else JV=true; fi
          if git diff --quiet -- data/soccer/rosters.json data/soccer/jv-rosters.json; then ROSTERS=false; else ROSTERS=true; fi
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"
          echo "jv=$JV" >> "$GITHUB_OUTPUT"
          echo "rosters=$ROSTERS" >> "$GITHUB_OUTPUT"
          if [ "$SNAPSHOT" != "true" ] && [ "$STATS" != "true" ] && [ "$JV" != "true" ] && [ "$ROSTERS" != "true" ]; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAY=$(node -e 'process.stdout.write(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date()))')
          SUMMARY=$(node -e '
            const meta = require("./data/soccer/snapshot.meta.json");
            const s = require("./data/soccer/player-stats.json").counts;
            const j = require("./data/soccer/jv.json").counts;
            const c = meta.counts;
            process.stdout.write(`${c.games} games, ${c.finals} finals · ${s.players} players · JV ${j.games} games, ${j.finals} final`);
          ')
          # deploy-cloudflare.yml accepts this commit as data only because it is recognisably this one:
          # author github-actions[bot], one parent, a message starting "data: refresh soccer", nothing but
          # the six files below (tests/workflows.test.ts).
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SNAPSHOT" = "true" ]; then
            git add data/soccer/snapshot.json data/soccer/snapshot.meta.json
          fi
          if [ "$STATS" = "true" ]; then
            git add data/soccer/player-stats.json
          fi
          if [ "$JV" = "true" ]; then
            git add data/soccer/jv.json
          fi
          if [ "$ROSTERS" = "true" ]; then
            git add data/soccer/rosters.json data/soccer/jv-rosters.json
          fi
          git commit -m "data: refresh soccer ${DAY} · ${SUMMARY}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Rebase-then-push so a commit landed in between (field hockey's refresh, a human) is not clobbered.
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### update-data-soccer"
            echo ""
            echo "- snapshot changed: \`${{ steps.commit.outputs.snapshot || 'false' }}\`"
            echo "- player stats changed: \`${{ steps.commit.outputs.stats || 'false' }}\`"
            echo "- player stats fetch: \`${{ steps.stats.outcome || 'skipped' }}\`"
            echo "- JV games changed: \`${{ steps.commit.outputs.jv || 'false' }}\`"
            echo "- JV games fetch: \`${{ steps.jv.outcome || 'skipped' }}\`"
            echo "- rosters changed: \`${{ steps.commit.outputs.rosters || 'false' }}\`"
            echo "- rosters fetch: \`${{ steps.rosters.outcome || 'skipped' }}\`"
            echo "- stats and JV restored after failing the tests: \`${{ steps.test.outputs.restored || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
