# The build gate: the four checks every change has to pass, plus the accessibility pass that
# DESIGN §10.9 asks for and that a headless browser is needed to run.
#
# This is deliberately separate from update-data.yml, which refreshes data/snapshot.json twice a
# day and runs only `pnpm test` on the snapshot it just wrote. That job must stay narrow — it
# commits to the default branch — while this one must fail loudly on anything a human changed.
#
# The a11y job runs axe-core against the real production build over one page of every route
# family, in both themes, and fails on a serious or critical violation. It is the automatable
# part of §10.9; the grayscale and forced-colors comparisons in (b) and (c) are still done by eye.
#
# The vinext job builds the same app with vinext (Vite) instead of Next and serves it with
# `vinext start`, the second toolchain package.json carries alongside Next. It proves what the
# Next build proves — every route prerendered at build time — and then that the server answers
# like `next start` does: status codes, content types, the next.config headers() cache rule,
# immutable precompressed assets, the root not-found, ETags. Then it runs the same axe pass. It
# runs beside `gates`, not after it, so a vinext regression is reported even when Next is red too.
#
# The cloudflare job does the same for the third deploy, vinext's Cloudflare Workers target: it
# validates the deploy setup with a dry run (no credentials needed), builds the Worker, checks
# that every prerendered route was packaged into its Static Assets upload, and runs the Worker
# locally in workerd (`vite preview`) for the smoke and axe passes. The upload itself is
# deploy-cloudflare.yml's job, and needs the account's secrets.
#
# All three servers — `next start` in a11y, `vinext start` in vinext, workerd in cloudflare — are
# held to one response contract by the same script, scripts/smoke-server.sh, which names the few
# checks that differ by deploy and why. scripts/assert-vinext-prerender.mjs is the prerender check
# both vinext builds share.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same ref makes the in-flight run pointless; PR runs are cancelled, and
# pushes to main are not, so main keeps a complete history of what passed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # pnpm BEFORE setup-node: `cache: pnpm` resolves the store path by running pnpm, and the
      # corepack shims installed for the runner's default Node are not guaranteed to still be on
      # PATH once setup-node switches to Node 26. action-setup reads packageManager from
      # package.json, so the pnpm version is still pinned by the repo.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # SCVAL_BUILD_AT pins the instant the "stale snapshot" warning is measured against
      # (components/layout/build-instant.ts), so two builds of one commit are byte-identical.
      - name: Build
        run: pnpm build
        env:
          SCVAL_BUILD_AT: ${{ github.event.repository.updated_at }}

      # Every route is prerendered from the snapshot, so a dynamic route here means something
      # lost its generateStaticParams — the site would start rendering on demand.
      - name: Assert every route is static
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pages = ["index", "about", "standings", "schedule", "playoffs", "teams", "history/2025-26"];
            const missing = pages.filter((p) => !fs.existsSync(`.next/server/app/${p}.html`));
            if (missing.length) throw new Error("not prerendered: " + missing.join(", "));
            const count = (dir) => fs.readdirSync(dir, { recursive: true }).filter((f) => f.endsWith(".html")).length;
            const games = count(".next/server/app/game");
            const dates = count(".next/server/app/scores");
            const teams = count(".next/server/app/teams");
            console.log(`prerendered: ${games} game pages, ${dates} date pages, ${teams} team pages`);
            if (games < 100 || dates < 30 || teams < 15) throw new Error("a generateStaticParams route came back short");
          '

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 3
          include-hidden-files: true

  a11y:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # pnpm BEFORE setup-node: `cache: pnpm` resolves the store path by running pnpm, and the
      # corepack shims installed for the runner's default Node are not guaranteed to still be on
      # PATH once setup-node switches to Node 26. action-setup reads packageManager from
      # package.json, so the pnpm version is still pinned by the repo.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # Not repo dependencies: axe and a browser are needed by CI, not by the site, and the
      # BUILD-BRIEF's no-new-dependency rule is about what ships. The action installs them in a
      # directory of their own and points NODE_PATH at it (see .github/actions/install-axe).
      - name: Install axe-core and Chromium
        uses: ./.github/actions/install-axe

      - name: Start the production server
        run: |
          set -euo pipefail
          pnpm exec next start -p 3117 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3117/; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "server did not come up"; exit 1

      # The response contract the two vinext servers below are held to, checked against Next
      # itself: the reference they are compared with must pass it too.
      - name: Smoke the production server
        run: bash scripts/smoke-server.sh http://127.0.0.1:3117 next

      - name: axe (serious and critical only)
        run: node scripts/a11y-axe.mjs

  vinext:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # pnpm BEFORE setup-node: `cache: pnpm` resolves the store path by running pnpm, and the
      # corepack shims installed for the runner's default Node are not guaranteed to still be on
      # PATH once setup-node switches to Node 26. action-setup reads packageManager from
      # package.json, so the pnpm version is still pinned by the repo.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      # This also applies patches/vinext@1.0.0.patch (patchedDependencies in pnpm-workspace.yaml,
      # which lists the gaps it closes). Without it the build below is refused outright: stock
      # vinext stops any build that lacks the cloudflare() plugin while cloudflare.config.ts
      # exists. A patch that applies only in part is caught after the build: the assertions fail
      # on pages that revalidate after five minutes, and the smoke on icons, OG images and Route
      # Handlers rendered on every request.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same pin as the Next build (components/layout/build-instant.ts): the instant the "stale
      # snapshot" warning is measured against comes from the event payload, not the runner's
      # clock, so a rerun is byte-identical and both builds stamp the same instant. cloudflare.config.ts
      # is present, so this also fails if the patch stops letting a Node build run beside it.
      - name: Build with vinext
        run: pnpm build:vinext
        env:
          SCVAL_BUILD_AT: ${{ github.event.repository.updated_at }}

      # The vinext counterpart of "Assert every route is static". vite.config.ts asks for every
      # route to be prerendered; vinext records each one in vinext-prerender.json and writes the
      # pages (.html) and the metadata routes and Route Handlers (.route) under prerendered-routes,
      # which `vinext start` seeds its cache from. A skipped or errored route, or one with a
      # revalidate lifetime, would be rendered on demand by the server instead; and the prerendered
      # sitemap must list exactly the prerendered pages.
      - name: Assert every route is prerendered
        run: node scripts/assert-vinext-prerender.mjs

      # Installed outside the checkout, as in the a11y job: here a reshaped node_modules could
      # swap the patched vinext for a stock one under the server (see .github/actions/install-axe).
      - name: Install axe-core and Chromium
        uses: ./.github/actions/install-axe

      # vite.config.ts inlines SCVAL_BUILD_AT into the build (define), so the 404s this server renders
      # on request measure the snapshot's age against the same instant as every prerendered page
      # whatever the server's environment says (README, "Deploy notes"); the smoke checks that they
      # agree on the stale-snapshot notice. The pin is passed anyway so the step matches the build
      # step, as a server that read it at run time would need.
      - name: Start the vinext server
        run: |
          set -euo pipefail
          pnpm exec vinext start --port 3118 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3118/; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "server did not come up"; exit 1
        env:
          SCVAL_BUILD_AT: ${{ github.event.repository.updated_at }}

      # What `next start` answers (the a11y job runs the same script against it): every page the
      # sitemap lists, the metadata routes and Route Handlers, with the next.config headers() cache
      # rule; hashed assets keep the immutable cache and are served precompressed; an unknown URL
      # or param is a no-store 404 with the root not-found page; pages answer a revalidation with
      # 304; poweredByHeader stays off, and vinext's internal cache marker never leaks. Every
      # mismatch, and every request that fails or times out, is listed before the step fails.
      - name: Smoke the vinext server
        run: bash scripts/smoke-server.sh http://127.0.0.1:3118 node

      - name: axe (serious and critical only)
        run: node scripts/a11y-axe.mjs
        env:
          SCVAL_BASE_URL: http://127.0.0.1:3118

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # pnpm BEFORE setup-node: `cache: pnpm` resolves the store path by running pnpm, and the
      # corepack shims installed for the runner's default Node are not guaranteed to still be on
      # PATH once setup-node switches to Node 26. action-setup reads packageManager from
      # package.json, so the pnpm version is still pinned by the repo.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      # This applies both patches (patchedDependencies in pnpm-workspace.yaml): vinext's, as in
      # the vinext job, and @vinext/cloudflare's, without which the Worker renders /icon-192 and
      # /icon-512 on every request. It also runs workerd's postinstall (allowBuilds), which checks
      # the platform binary `vite preview` runs the Worker in below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What `pnpm deploy:cloudflare` checks before it builds or uploads anything, all of it by
      # existence or text scan: cloudflare.config.ts is there, the deploy dependencies (cf,
      # @cloudflare/vite-plugin) are installed, and vite.config.ts imports and calls cloudflare().
      # It needs no credentials, so it runs first and a missing piece fails in seconds. It never
      # loads cloudflare.config.ts: the build below is the first to parse it, and the smoke checks
      # the Worker config the build emitted from it.
      - name: Validate the deploy setup (dry run)
        run: pnpm exec vinext-cloudflare deploy --env cloudflare --dry-run

      # The same build `pnpm deploy:cloudflare` uploads, in mode `cloudflare` (vite.config.ts):
      # the Worker bundle and its Static Assets in .cloudflare/output, every route prerendered in
      # Node first. SCVAL_BUILD_AT is pinned as in the other builds. SITE_URL is set to an origin
      # that is not the localhost default, because vite.config.ts inlines it at build time: the
      # smoke below then proves that the prerendered pages and the 404s the Worker renders on
      # request agree on it (.invalid is reserved, so nothing ever resolves it).
      - name: Build the Worker
        run: pnpm build:cloudflare
        env:
          SCVAL_BUILD_AT: ${{ github.event.repository.updated_at }}
          SITE_URL: https://scvalfh.example.invalid

      # The Workers counterpart of the vinext job's assertion. A Worker has no filesystem to seed a
      # cache from: what it serves without rendering is what staticAssetsAdapter() packaged under
      # /_vinext/static-cache/ in the Static Assets upload. So on top of the prerender check, every
      # prerendered page, RSC payload and .route body must be listed in its index.json, kind for
      # kind (the counts follow the snapshot, so they are compared with the prerender, never
      # hardcoded), and every file the index lists must be there; `_headers` must give
      # /_next/static/* the immutable cache; no precompressed copy may ship, and nothing may sit at
      # the top level of the upload but `_headers`, `_next/` and `_vinext/` (build metadata is kept
      # out by .assetsignore). And nothing that can hold a secret is in the output: the plugin reads
      # .dev.vars and .env* for local runs only, and anything under .cloudflare/output is uploaded.
      - name: Assert every route is prerendered and packaged
        run: |
          set -euo pipefail
          node scripts/assert-vinext-prerender.mjs --cloudflare
          test -f .cloudflare/output/v0/config.json || { echo "no Build Output config in .cloudflare/output"; exit 1; }
          leaked=$(find .cloudflare/output \( -name '.dev.vars*' -o -name '.env*' \) -print)
          if [ -n "$leaked" ]; then echo "env files in the Worker output:"; echo "$leaked"; exit 1; fi

      # Installed outside the checkout, as in the a11y job: here a reshaped node_modules could swap
      # the patched vinext or @vinext/cloudflare for a stock one (see .github/actions/install-axe).
      - name: Install axe-core and Chromium
        uses: ./.github/actions/install-axe

      # The built Worker in workerd, the runtime Cloudflare runs it on, through the Cloudflare Vite
      # plugin's preview server: it serves .cloudflare/output as built (no rebuild) with the
      # bindings cloudflare.config.ts declares. Its log is printed if it never answers.
      - name: Start the Worker (workerd)
        run: |
          set -euo pipefail
          pnpm exec vite preview --mode cloudflare --port 3119 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3119/; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "Worker did not come up"; cat "$RUNNER_TEMP/preview.log"; exit 1

      # The contract the other two servers pass, held to the Worker. scripts/smoke-server.sh names
      # the checks that differ on `workers` and why: no gzip on the CSS (workerd preview compresses
      # nothing; in production Cloudflare's edge does, after the Worker), and the bare
      # If-None-Match 304 (`vite preview` forwards a conditional request with Cache-Control:
      # no-cache, so revalidation is checked as a browser sends it, with max-age=0). It adds that
      # the static cache's raw files are not public and that the emitted Worker config is the one
      # cloudflare.config.ts declares.
      - name: Smoke the Worker
        run: bash scripts/smoke-server.sh http://127.0.0.1:3119 workers

      - name: axe (serious and critical only)
        run: node scripts/a11y-axe.mjs
        env:
          SCVAL_BASE_URL: http://127.0.0.1:3119
