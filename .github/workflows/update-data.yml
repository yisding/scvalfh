# Daily data refresh: re-run the MaxPreps sweep and the secondary sources, then the MaxPreps player
# stats (all 99 teams, all nine leagues), then the JV games (MaxPreps' JV schedules and si.com's JV
# pages), and commit data/snapshot.json, data/player-stats.json and data/jv.json only where the
# CONTENT actually changed.
#
# Schedule (SPEC §5.2 — one to two runs a day, never more):
#   0 5  UTC = 10:00 PM Pacific during PDT — catches the evening's results once coaches enter them
#   0 14 UTC =  7:00 AM Pacific during PDT — catches everything entered overnight
# The month field is UTC while the script's season guard is PACIFIC, and Pacific is BEHIND UTC
# (UTC-7/-8) — never ahead. So the disagreement is one-sided: it needs a month at the DECEMBER end,
# where the Nov 30 evening run is 2026-12-01T05:00Z, and none at the August end, where the earliest
# Pacific-August instant (Aug 1 00:00 PDT) is already 2026-08-01T07:00Z. A UTC-July fire is always
# Pacific July, which the season-window guard (lib/pipeline/steps/window.ts: the sections' season
# windows, Aug 1 – Nov 30 Pacific) rejects every time — 62 runs a season that each did a checkout,
# an apt install, `pnpm install --frozen-lockfile` and the whole test suite before correctly
# writing nothing. Hence 8-12, with the scripts' own
# Aug 1 – Nov 30 Pacific guard still the single source of truth for the window: an out-of-season
# cron fires, both scripts exit 0 and write nothing (fetch-player-stats imports the same
# `inSeasonWindow` from lib/pipeline/steps/window.ts).
#
# Player stats ride the same run because they move after every game, as the scores do, and the
# same commit, so a refresh is still one deploy. They cover every registry team of the nine
# leagues (99 small JSON calls through the MaxPreps client's politeness gate); a failure is scoped
# to the team, which keeps its previous rows (lib/fetch-scope.ts), so one league's outage never
# blocks another's stats. Their fetch is allowed to fail: a MaxPreps hiccup on the stats endpoint
# must never cost the day's scores. Nor may the stats file the fetch wrote: when the tests fail
# and data/player-stats.json changed in this run, the Test step restores the committed one and runs
# the tests again, so only a failure that is not the stats file's blocks the snapshot commit.
# The JV games ride the same run on the same terms as the stats (scripts/fetch-jv.ts: 99 MaxPreps JV
# feeds through the same politeness gate, then up to 98 si.com JV pages one at a time, 1 s apart):
# allowed to fail, scoped to the team and the source, and a JV file the tests refuse is restored the
# same way, so JV never costs the day's scores or stats.
# deploy-cloudflare.yml ships these commits
# without a ci run of its own only because it recognises them; the commit step below says how, and
# tests/workflows.test.ts holds the two files to it.
#
# The push deliberately does NOT carry [skip ci]: the commit is what triggers the hosting
# provider's rebuild, which is the entire point of the job.
#
# Nine leagues (SPEC §7.5, §7.14): a league that cannot be refreshed is FROZEN or DEGRADED inside
# the snapshot (its reasons are published on the site) and the run still exits 0 and commits. The
# job fails, and commits nothing, only on a run abort (fetch-data exits 1: season ids changed, the
# assembled snapshot failed validation, or a systemic outage), which keeps the previous snapshot.
# After a successful run it keeps one open issue per official schedule revised upstream and per
# league frozen in this run AND the previous one.

name: update-data

on:
  schedule:
    - cron: '0 14 * 8-12 *'
    - cron: '0 5 * 8-12 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside the Aug 1 - Nov 30 season window'
        type: boolean
        default: false
      skip_sblive:
        description: 'Skip the SBLive score cross-check'
        type: boolean
        default: false
      leagues:
        description: 'Only these leagues, comma-separated (e.g. bval,pcal); the others are carried forward (frozen in the snapshot, previous rows in the player stats)'
        type: string
        default: ''
      accept_regression:
        description: 'Skip the finals-regression guard for these leagues this run, comma-separated (e.g. bval)'
        type: string
        default: ''

permissions:
  contents: write
  # One issue per revised official schedule / long-frozen league (see "Open or update issues").
  issues: write

# Never let two refreshes race on the same branch; a queued run would only rewrite what the
# in-flight one is about to commit.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The fetch step alone may take 20 minutes (128 MaxPreps requests at ≥500 ms apart plus the
    # official, si.com, VNN and CCS sources, with retries); install and test come on top.
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # A shallow clone is enough; we only ever add one commit on top of the default branch.
          fetch-depth: 1

      # pdftotext, for the two official SCVAL schedule PDFs (BVAL, PCAL and MCAL fixtures are bundled
      # under data/official/). Without it the SCVAL PDF sources fail and the previous run's SCVAL
      # fixtures are carried forward, so a bad apt mirror must NOT take the whole day's refresh with it.
      - name: Install poppler-utils (pdftotext)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      # pnpm BEFORE setup-node: `cache: pnpm` resolves the store path by running pnpm, and the
      # corepack shims installed for the runner's default Node are not guaranteed to still be on
      # PATH once setup-node switches to the .nvmrc Node. action-setup reads packageManager from
      # package.json, so the pnpm version is still pinned by the repo.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Pinned in .nvmrc to the version this repo is developed and tested on, so a CI-only Node
      # difference cannot be the reason a snapshot fails to build.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exit 1 only on a run abort (nothing written, the previous snapshot stays); a frozen or
      # degraded league is a published state, not a failure. Inputs reach the command through env,
      # never by interpolating them into the script.
      - name: Fetch data
        timeout-minutes: 20
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          SKIP_SBLIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_sblive && '1' || '' }}
          LEAGUES: ${{ github.event_name == 'workflow_dispatch' && inputs.leagues || '' }}
          ACCEPT_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_regression || '' }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$FORCE" ] && args+=(--force)
          [ -n "$SKIP_SBLIVE" ] && args+=(--no-sblive)
          if [ -n "$LEAGUES" ]; then
            [[ "$LEAGUES" =~ ^[a-z0-9,-]+$ ]] || { echo "invalid leagues input: $LEAGUES"; exit 1; }
            args+=(--leagues "$LEAGUES")
          fi
          if [ -n "$ACCEPT_REGRESSION" ]; then
            [[ "$ACCEPT_REGRESSION" =~ ^[a-z0-9,-]+$ ]] || { echo "invalid accept_regression input: $ACCEPT_REGRESSION"; exit 1; }
            args+=(--accept-regression "$ACCEPT_REGRESSION")
          fi
          pnpm fetch-data "${args[@]}"

      # Never fatal. The script exits 1 when a team's call failed, having still written the file
      # with that team's previous rows carried forward (status 'carried-forward'), which is worth
      # committing; a crash before it writes leaves the committed file as it was. Either way the
      # snapshot above still ships. It writes nothing when only its fetchedAt stamps would change.
      # Its own timeout keeps a hung stats endpoint from eating the job's budget (99 teams, one
      # request each at the MaxPreps politeness gate's pace of at most 3 at once and 500 ms apart;
      # the 43 teams of the four leagues before the EAL took about 25 seconds). The manual force
      # and leagues inputs reach it through env, like Fetch data's, never by interpolation into
      # the script.
      - name: Fetch player stats
        id: stats
        continue-on-error: true
        timeout-minutes: 10
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          LEAGUES: ${{ github.event_name == 'workflow_dispatch' && inputs.leagues || '' }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$FORCE" ] && args+=(--force)
          if [ -n "$LEAGUES" ]; then
            [[ "$LEAGUES" =~ ^[a-z0-9,-]+$ ]] || { echo "invalid leagues input: $LEAGUES"; exit 1; }
            args+=(--leagues "$LEAGUES")
          fi
          pnpm fetch-player-stats "${args[@]}"

      # Never fatal, like the stats step above: the script exits 1 when a team's MaxPreps or si.com
      # read failed, having still written the file with that team's previous rows carried forward;
      # it writes nothing when only its fetchedAt stamps would change. The manual force and leagues
      # inputs reach it through env, never by interpolation into the script.
      - name: Fetch JV games
        id: jv
        continue-on-error: true
        timeout-minutes: 10
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          LEAGUES: ${{ github.event_name == 'workflow_dispatch' && inputs.leagues || '' }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$FORCE" ] && args+=(--force)
          if [ -n "$LEAGUES" ]; then
            [[ "$LEAGUES" =~ ^[a-z0-9,-]+$ ]] || { echo "invalid leagues input: $LEAGUES"; exit 1; }
            args+=(--leagues "$LEAGUES")
          fi
          pnpm fetch-jv "${args[@]}"

      # The suite validates what was just written: the snapshot's schema invariants, the never-0-0
      # rule and the standings arithmetic, and the player-stats contract and its join to the
      # rosters. A bad file must not be committed.
      #
      # The stats and the JV games are allowed to fail (above), so a file of theirs the tests refuse
      # must not cost the snapshot either, and one file's failure must not cost the other file. When
      # the suite fails, it runs again without this run's JV file (restored to the committed one);
      # if that passes, the JV file was the problem. If not, this run's JV file goes back and the
      # stats file is restored instead; if that passes, the stats file was the problem and the new
      # JV file is kept. Only when neither alone is enough are both restored for a last run, whose
      # verdict decides. A file that did not change in this run is never restored (the commit step
      # then sees no change in a restored file), and with neither changed the first verdict decides.
      - name: Test
        id: test
        run: |
          set -uo pipefail
          if pnpm test; then exit 0; fi
          jv_changed=false
          stats_changed=false
          git diff --quiet -- data/jv.json || jv_changed=true
          git diff --quiet -- data/player-stats.json || stats_changed=true
          if [ "$jv_changed" != true ] && [ "$stats_changed" != true ]; then
            echo "::error::the tests failed and neither data/jv.json nor data/player-stats.json changed in this run"
            exit 1
          fi
          if [ "$jv_changed" = true ]; then
            NEW_JV="${RUNNER_TEMP:-/tmp}/jv-this-run.json"
            cp data/jv.json "$NEW_JV"
            echo "::warning::the tests failed; testing again without this run's data/jv.json"
            git checkout -- data/jv.json
            if pnpm test; then echo "jv_restored=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$stats_changed" != true ]; then echo "jv_restored=true" >> "$GITHUB_OUTPUT"; exit 1; fi
            # Not the JV file alone: put it back and try without this run's stats file instead.
            cp "$NEW_JV" data/jv.json
          fi
          echo "::warning::the tests failed; testing again without this run's data/player-stats.json"
          git checkout -- data/player-stats.json
          echo "stats_restored=true" >> "$GITHUB_OUTPUT"
          if pnpm test; then exit 0; fi
          if [ "$jv_changed" != true ]; then exit 1; fi
          echo "::warning::the tests still failed; testing again without this run's data/jv.json either"
          git checkout -- data/jv.json
          echo "jv_restored=true" >> "$GITHUB_OUTPUT"
          pnpm test

      # One open issue per official schedule revised upstream (a stale official-revision-check
      # row) and per league frozen in this run AND the previous one, each with the published
      # reasons as its body (scripts/data-issues.ts builds them, typed and tested). Edited in place
      # on later runs: never more than one open issue per title. Runs before the commit step, which
      # may restore the unchanged files.
      - name: Open or update issues
        # Bookkeeping only: a GitHub API hiccup here must never cost the day's snapshot commit.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV="${RUNNER_TEMP:-/tmp}/previous-meta-for-issues.json"
          git show HEAD:data/snapshot.meta.json > "$PREV" 2>/dev/null || echo '{}' > "$PREV"
          OUT="${RUNNER_TEMP:-/tmp}/issues"
          rm -rf "$OUT" && mkdir -p "$OUT"
          pnpm exec tsx scripts/data-issues.ts "$PREV" "$OUT"
          for title_file in "$OUT"/*.title; do
            [ -e "$title_file" ] || continue
            title=$(cat "$title_file")
            body_file="${title_file%.title}.body"
            number=$(gh issue list --state open --limit 100 --search "in:title \"$title\"" --json number,title \
              --jq "map(select(.title == \"$title\")) | first | .number // empty")
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$body_file"
            else
              gh issue create --title "$title" --body-file "$body_file"
            fi
          done

      - name: Commit the data that changed
        id: commit
        run: |
          set -euo pipefail
          # The snapshot. `git diff --quiet` on snapshot.json can never be quiet: the run's
          # timestamp is written into the top-level `fetchedAt` AND into every game's provenance, so
          # two runs over identical upstream data differ by ~370 lines of pure stamp. Committing that
          # would push a no-op diff and trigger a hosting rebuild twice a day for nothing, and
          # `git log` would stop telling anyone which refresh actually moved a score.
          #
          # snapshot.meta.json publishes `contentHash`: a SHA-256 over the snapshot with every
          # `fetchedAt` stripped (lib/snapshot-schema.ts). That is what "changed" means here.
          PREV="${RUNNER_TEMP:-/tmp}/previous-snapshot-meta.json"
          git show HEAD:data/snapshot.meta.json > "$PREV" 2>/dev/null || true
          SNAPSHOT=$(node -e '
            const fs = require("node:fs");
            const hashOf = (p) => {
              try { return JSON.parse(fs.readFileSync(p, "utf8")).contentHash ?? null; }
              catch { return null; }
            };
            const next = hashOf("data/snapshot.meta.json");
            const prev = hashOf(process.argv[1]);
            // No hash on either side ⇒ treat it as changed rather than silently skipping.
            process.stdout.write(next === null || prev === null || next !== prev ? "true" : "false");
          ' "$PREV")
          if [ "$SNAPSHOT" != "true" ]; then
            echo "no snapshot change — only the run timestamp moved"
            # Drop the timestamp-only churn so the working tree matches HEAD exactly.
            git checkout -- data/snapshot.json data/snapshot.meta.json
          fi
          # The player stats. fetch-player-stats leaves the file untouched when only its stamps
          # would change (playerStatsContentKey in lib/player-stats-schema.ts), so a plain diff is
          # the content check.
          if git diff --quiet -- data/player-stats.json; then STATS=false; else STATS=true; fi
          # The JV games: fetch-jv leaves the file untouched when only its stamps would change
          # (jvContentKey in lib/jv-schema.ts), so a plain diff is the content check here too.
          if git diff --quiet -- data/jv.json; then JV=false; else JV=true; fi
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"
          echo "jv=$JV" >> "$GITHUB_OUTPUT"
          if [ "$SNAPSHOT" != "true" ] && [ "$STATS" != "true" ] && [ "$JV" != "true" ]; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATS_SUMMARY=$(node -e '
            const c = require("./data/player-stats.json").counts;
            process.stdout.write(`${c.players} players on ${c.teamsWithStats} teams`);
          ')
          JV_SUMMARY=$(node -e '
            const c = require("./data/jv.json").counts;
            process.stdout.write(`${c.games} games, ${c.finals} final`);
          ')
          # deploy-cloudflare.yml ships this commit without a ci run of its own only because it is
          # recognisably this one: author github-actions[bot], one parent, a message starting
          # "data: refresh snapshot", "data: refresh player stats" or "data: refresh JV games",
          # nothing but data/snapshot.json, data/snapshot.meta.json, data/player-stats.json and
          # data/jv.json. Keep them in step (tests/workflows.test.ts checks the messages and files
          # against the gate).
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$JV" = "true" ]; then
            git add data/jv.json
          fi
          # The message names the biggest change first; a JV change rides along as "+ JV games".
          JV_TAIL=''
          [ "$JV" = "true" ] && JV_TAIL=" + JV games (${JV_SUMMARY})"
          if [ "$SNAPSHOT" = "true" ]; then
            SUMMARY=$(node -e '
              const meta = require("./data/snapshot.meta.json");
              // meta.today is the PACIFIC date; meta.fetchedAt is UTC and would read as tomorrow
              // for the 10 PM Pacific run. commitSummary is per league, e.g.
              // "SCVAL +3 finals · BVAL +2 · PCAL frozen (meta season mismatch) · MCAL +4".
              const day = meta.today ?? meta.fetchedAt.slice(0, 10);
              const c = meta.counts;
              const summary = meta.commitSummary ?? `${c.games} games, ${c.finals} finals`;
              process.stdout.write(`${day} · ${summary}`);
            ')
            if [ "$STATS" = "true" ]; then
              git add data/snapshot.json data/snapshot.meta.json data/player-stats.json
              git commit -m "data: refresh snapshot ${SUMMARY} + player stats (${STATS_SUMMARY})${JV_TAIL}"
            else
              git add data/snapshot.json data/snapshot.meta.json
              git commit -m "data: refresh snapshot ${SUMMARY}${JV_TAIL}"
            fi
          else
            DAY=$(node -e 'process.stdout.write(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date()))')
            if [ "$STATS" = "true" ]; then
              git add data/player-stats.json
              git commit -m "data: refresh player stats ${DAY} (${STATS_SUMMARY})${JV_TAIL}"
            else
              git commit -m "data: refresh JV games ${DAY} (${JV_SUMMARY})"
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Rebase-then-push so a commit landed by a human between checkout and push is not clobbered.
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### update-data"
            echo ""
            echo "- snapshot changed: \`${{ steps.commit.outputs.snapshot || 'false' }}\`"
            echo "- player stats changed: \`${{ steps.commit.outputs.stats || 'false' }}\`"
            echo "- player stats fetch: \`${{ steps.stats.outcome || 'skipped' }}\`"
            echo "- player stats restored after failing the tests: \`${{ steps.test.outputs.stats_restored || 'false' }}\`"
            echo "- JV games changed: \`${{ steps.commit.outputs.jv || 'false' }}\`"
            echo "- JV games fetch: \`${{ steps.jv.outcome || 'skipped' }}\`"
            echo "- JV games restored after failing the tests: \`${{ steps.test.outputs.jv_restored || 'false' }}\`"
            if [ -f data/snapshot.meta.json ]; then
              echo ""
              echo '```json'
              cat data/snapshot.meta.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
