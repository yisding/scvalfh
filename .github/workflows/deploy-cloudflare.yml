# Deploy the vinext Cloudflare Workers build (README "Cloudflare Workers") to the account the repo's
# secrets name. It is the third deploy beside `next start` and `vinext start`, and the one a
# workflow can own end to end: `pnpm run deploy:cloudflare` builds in mode `cloudflare`, prerenders
# every route and uploads the Worker and its Static Assets with `cf deploy`.
#
# One Worker per sport. Each sport is its own build (lib/sports/current.ts), so the job is a matrix
# over the three: field hockey's Worker keeps the name 'scvalfh', soccer's and basketball's are
# 'scvalfh-soccer' and 'scvalfh-basketball' (cloudflare.config.ts). Each sport has its own SITE_URL
# variable, its own GitHub Deployment environment and its own concurrency group, so one sport's
# deploy never waits on, or is recorded as, another's.
#
# When it runs. Like the hosting rebuild the README describes ("Deploy notes"), a new commit on
# main is what redeploys — including update-data.yml's snapshot commit, which is the whole point of
# that job. But update-data pushes with GITHUB_TOKEN, and a push made with GITHUB_TOKEN starts no
# `push` workflow, so a `push` trigger here would never see a data refresh. Instead this follows
# the two workflows that put commits on main, ci (a green run on main, never a pull_request run)
# and update-data (a green run), and every run deploys main's tip as it is when the run starts.
#
# What may ship. The code that ships must have passed ci on main; update-data's data commits only
# replace data/snapshot.json, its meta file, data/player-stats.json and data/jv.json, after running
# the suite on them, and ci never runs on them. So the gate walks down from main's tip past the data
# commits (by the bot, one parent, "data: refresh snapshot ...", "data: refresh player stats ...",
# "data: refresh JV games ...", update-data-soccer.yml's "data: refresh soccer ..." or
# update-data-basketball.yml's "data: refresh basketball ...") to the newest
# other commit, the one whose code ships, requires a successful ci run on main for exactly that commit,
# and requires that nothing but those data files (the four of data/, and the same four plus the two roster
# files of data/soccer/ and of data/basketball/) changed above it. A soccer or basketball data commit changes nothing this Worker
# serves; it is let through so that it never holds back the next field hockey deploy. Otherwise it
# skips: the ci run of that commit deploys main once it passes, and a red one never ships,
# whichever workflow happened to finish first. Thus:
#   - after ci: main's tip, whose code is the commit ci just passed (or, if a human commit landed
#     since, main's tip only once that commit's own ci has passed);
#   - after update-data: main's tip (its new data, or commits whose ci has passed). A data commit
#     rebased onto a human commit whose ci is still running waits for that ci.
# Every successful deploy is recorded as a GitHub Deployment (environment "cloudflare", or
# "cloudflare-soccer" and "cloudflare-basketball" for the other sports) for the
# commit it shipped, and a workflow_run deploy skips a tip that already has one. That record, not
# the triggering run, decides: a run that finds the tip undeployed deploys it, whichever workflow
# finished first and whatever happened to the run queued before it. Deploying the tip, never the
# triggering commit, means an older build never overwrites a newer one. workflow_dispatch deploys
# main's tip by hand under the same ci check (it fails, rather than skips, when the tip's code has
# not passed ci) and redeploys it even when it is recorded as deployed, e.g. once the secrets are
# first set or after SITE_URL changes.
#
# Configuration (repository Settings → Secrets and variables → Actions):
#   - secret CLOUDFLARE_API_TOKEN: a token from the "Edit Cloudflare Workers" template;
#   - variable CLOUDFLARE_ACCOUNT_ID (or a secret of that name; it is not secret): the account the
#     three Workers (cloudflare.config.ts) are deployed to;
#   - variables SITE_URL (field hockey), SITE_URL_SOCCER and SITE_URL_BASKETBALL: each Worker's
#     public origin (https://scvalfh.<subdomain>.workers.dev, or the custom domain routed to it).
#     vite.config.ts inlines it at build time into every canonical URL, og:image, the sitemap and
#     robots.txt; unset it would fall back to http://localhost:3000 (components/layout/site.ts), so
#     it is required here rather than defaulted.
# With no CLOUDFLARE_API_TOKEN the run is a green no-op with a notice saying so: a fork, or this
# repo before an account is connected, is not a failure. A token without the account ID or field
# hockey's SITE_URL is a half-done setup, and fails naming what is missing. Soccer's or
# basketball's SITE_URL unset is a green skip of that sport alone, so the sites can be moved over
# one at a time.
#
# SCVAL_BUILD_AT is deliberately NOT pinned as in ci.yml: a production build should stamp the
# instant it really ran (vite.config.ts takes the clock once per build), because that is what the
# footer's stale-snapshot notice measures the snapshot's age against; ci pins it only so its
# builds are reproducible.

name: deploy-cloudflare

on:
  workflow_run:
    workflows: [ci, update-data]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# actions: read for the gate's lookup of ci runs (the API that lists a workflow's runs);
# deployments: write to record each deploy as a GitHub Deployment, which the gate reads.
permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  deploy:
    # A failed or cancelled ci/update-data run deploys nothing; a pull_request run of ci never does
    # (`branches` matches the head branch, which can be a fork's main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One Worker per sport (see the top). `environment` is the GitHub Deployment environment the
    # gate reads and the record step writes: field hockey keeps "cloudflare", which already holds
    # its history. `site_url` names the variable holding the sport's origin; `optional` makes an
    # unset one a skip rather than a failure.
    strategy:
      fail-fast: false
      matrix:
        include:
          - sport: field-hockey
            environment: cloudflare
            site_url: SITE_URL
            optional: ''
          - sport: soccer
            environment: cloudflare-soccer
            site_url: SITE_URL_SOCCER
            optional: '1'
          - sport: basketball
            environment: cloudflare-basketball
            site_url: SITE_URL_BASKETBALL
            optional: '1'

    # One deploy per sport at a time, and never cancelled halfway through an upload. Two data
    # refreshes (or a refresh and a human commit) landing close together queue here instead of
    # racing; the queued run then finds main's tip itself, so the last deploy to finish is always
    # the newest commit. GitHub keeps only one pending run per group (a newer one replaces it); that
    # loses nothing: the run that replaces it deploys the same tip unless a Deployment already
    # records it, so a tested commit whose pending deploy was displaced (by a refresh that committed
    # nothing, say) still ships. Field hockey keeps the group's original name.
    concurrency:
      group: ${{ matrix.sport == 'field-hockey' && 'deploy-cloudflare' || format('deploy-cloudflare-{0}', matrix.sport) }}
      cancel-in-progress: false

    # Non-secret settings for every step. The API token is passed only to the two steps that need
    # it (the check below and the deploy), not to the install's postinstall scripts. SCVAL_SPORT
    # picks the build's data (lib/sports/current.ts) and the Worker's name (cloudflare.config.ts).
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars[matrix.site_url] }}
      SCVAL_SPORT: ${{ matrix.sport }}
      ENVIRONMENT: ${{ matrix.environment }}

    steps:
      # Decides whether this run deploys, and which commit. `ready` gates every later step, so a
      # skip leaves the run green; a broken setup fails here, before anything is installed.
      - name: Check the configuration and pick the commit
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SOURCE: ${{ github.event.workflow_run.name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SITE_URL_VAR: ${{ matrix.site_url }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          set -euo pipefail
          skip() { echo "::notice title=deploy-cloudflare skipped::$1"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            skip "skipped: no CLOUDFLARE_API_TOKEN secret, so nothing is deployed. Add it, the CLOUDFLARE_ACCOUNT_ID variable and the SITE_URL variable to deploy (README \"Cloudflare Workers\")."
          fi
          if [ -z "$SITE_URL" ] && [ -n "$OPTIONAL" ]; then
            skip "skipped $SCVAL_SPORT: no $SITE_URL_VAR variable, so its Worker is not set up. Add it to deploy $SCVAL_SPORT."
          fi
          missing=''
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=' CLOUDFLARE_ACCOUNT_ID'
          [ -n "$SITE_URL" ] || missing+=" $SITE_URL_VAR"
          if [ -n "$missing" ]; then
            echo "::error title=deploy-cloudflare misconfigured::CLOUDFLARE_API_TOKEN is set but these are not:$missing (Actions variables; README \"Cloudflare Workers\")"
            exit 1
          fi
          # An origin, as site.ts expects (it drops one trailing slash): a path, query string or
          # stray whitespace would end up in front of every canonical URL and the sitemap. Host
          # characters only, an optional port, nothing after but one slash.
          origin_re='^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$'
          if [[ ! "$SITE_URL" =~ $origin_re ]]; then
            echo "::error title=deploy-cloudflare misconfigured::$SITE_URL_VAR '$SITE_URL' must be an origin such as https://scvalfh.example.workers.dev (scheme, host and optional port; no path, query or spaces)"
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo "::error title=deploy-cloudflare::production deploys come from main; run this workflow on main, not $REF"
            exit 1
          fi
          # Not deploying is a green skip after a workflow_run, and a failure when asked by hand.
          refuse() {
            if [ "$EVENT" = workflow_dispatch ]; then echo "::error title=deploy-cloudflare::$1"; exit 1; fi
            skip "skipped: $1"
          }
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # Already shipped? The record step below creates a GitHub Deployment for the commit it
          # deployed, only after cf deploy succeeded, so one for the tip means the live Worker is
          # this build. A run that finds none deploys, whichever run came before it; by hand, a
          # redeploy of the same tip is wanted (new SITE_URL, a failed promotion), so only a
          # workflow_run skips.
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$tip&environment=$ENVIRONMENT&per_page=1" --jq length)
          if [ "$EVENT" = workflow_run ] && [ "$deployed" != 0 ]; then
            skip "skipped: main's tip $tip is already deployed (a GitHub Deployment records it), so the live Worker is current."
          fi
          # Nothing this sport's build reads changed? Every refresh commit triggers all three
          # sports' runs, but a build reads only its own sport's data (lib/sports/current.ts
          # DATA_DIR), so a change that is only another sport's data files leaves this Worker's
          # build as it is: the rule of scripts/vercel-ignore-build.sh, against this sport's last
          # recorded deploy. Not recorded, so the next run compares from the same deploy. Anything
          # undecidable (no deploy yet, a compare that is not "ahead") deploys.
          last=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$ENVIRONMENT&per_page=1" --jq '.[0].sha // ""')
          if [ "$EVENT" = workflow_run ] && [ -n "$last" ]; then
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last...$tip" \
              --jq 'if .status == "ahead" then .files[]?.filename else "(not ahead)" end' 2>/dev/null || echo '(the compare failed)')
            own=''
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$SCVAL_SPORT" in
                field-hockey) case "$file" in data/soccer/* | data/basketball/*) ;; *) own="$file" ;; esac ;;
                *) case "$file" in "data/$SCVAL_SPORT/"*) own="$file" ;; data/*) ;; *) own="$file" ;; esac ;;
              esac
              [ -z "$own" ] || break
            done <<< "$changed"
            [ -n "$own" ] || [ -z "$changed" ] || skip "skipped $SCVAL_SPORT: only another sport's data changed since its last deploy ($last)."
          fi
          # base: the newest commit at or below main's tip that is not an update-data data commit
          # (update-data.yml, update-data-soccer.yml and update-data-basketball.yml "Commit the data that
          # changed": by the bot, one parent, one of those five message prefixes). Its code is the code that ships; the data commits above it only replace
          # the data, which update-data ran the suite on before it pushed (ci never runs on them:
          # they are pushed with GITHUB_TOKEN). tests/workflows.test.ts holds the messages and the
          # file list below to what update-data.yml commits.
          base=''
          for page in 1 2 3 4 5; do
            base=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$tip&per_page=100&page=$page" --jq '
              first(.[] | select(((.author.login // "") == "github-actions[bot]"
                and ((.commit.message | startswith("data: refresh snapshot"))
                  or (.commit.message | startswith("data: refresh player stats"))
                  or (.commit.message | startswith("data: refresh JV games"))
                  or (.commit.message | startswith("data: refresh soccer"))
                  or (.commit.message | startswith("data: refresh basketball")))
                and (.parents | length) == 1) | not) | .sha) // ""')
            [ -z "$base" ] || break
          done
          [ -n "$base" ] || refuse "main ($tip) sits on more than 500 data commits; deploy by hand after checking it."
          # Between base and the tip only the data files (field hockey's four; soccer's and basketball's six each, the roster files included) may change, so the tree that ships is
          # base's tree with newer data.
          others=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$tip" --jq '
            if .status == "identical" or .status == "ahead"
            then [.files[]?.filename] - ["data/snapshot.json", "data/snapshot.meta.json", "data/player-stats.json", "data/jv.json", "data/soccer/snapshot.json", "data/soccer/snapshot.meta.json", "data/soccer/player-stats.json", "data/soccer/jv.json", "data/soccer/rosters.json", "data/soccer/jv-rosters.json", "data/basketball/snapshot.json", "data/basketball/snapshot.meta.json", "data/basketball/player-stats.json", "data/basketball/jv.json", "data/basketball/rosters.json", "data/basketball/jv-rosters.json"] | join(" ")
            else "(main is \(.status), not ahead)" end' 2>/dev/null || echo '(the compare failed)')
          [ -z "$others" ] || refuse "main ($tip) changes more than the data above $base: $others"
          # And base must have passed ci on main: a successful ci run for that exact commit, other
          # than a pull_request run (a fork's branch can be called main too). For a ci run that
          # is the run that triggered this one, unless main has gained a commit since; then that
          # commit's own ci run decides, and a red one never ships.
          if [ "$EVENT" != workflow_run ] || [ "$SOURCE" != ci ] || [ "$SOURCE_SHA" != "$base" ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$base&branch=main&status=success" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")] | length')
            [ "$passed" -gt 0 ] || refuse "main is at $tip, whose code is $base's, and ci has not passed on $base on main (yet); its ci run deploys main once it does."
          fi
          echo "deploying $tip"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.sha }}

      # pnpm BEFORE setup-node: `cache: pnpm` resolves the store path by running pnpm, and the
      # corepack shims installed for the runner's default Node are not guaranteed to still be on
      # PATH once setup-node switches to the .nvmrc Node. action-setup reads packageManager from
      # package.json, so the pnpm version is still pinned by the repo.
      - name: Set up pnpm
        if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # Applies both patches (pnpm-workspace.yaml); the build below depends on them as ci's
      # cloudflare job does.
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Build, prerender and upload in one: `vinext-cloudflare deploy --env cloudflare` builds in
      # mode `cloudflare`, which `cf deploy` requires of the output it uploads. Through `pnpm run`
      # because bare `pnpm deploy` is pnpm's own command. SITE_URL comes from the job env above.
      # NODE_ENV=production as the `vite build` CLI would set it: the deploy command loads
      # vite.config.ts, builds and prerenders in-process, where nothing else sets it.
      - name: Build and deploy the Worker
        if: steps.gate.outputs.ready == 'true'
        run: pnpm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_ENV: production

      # Only reached when the step above succeeded (a failed deploy stops the job, and the next run
      # finds the tip unrecorded and tries again). The Deployment is what the gate reads; its
      # status carries the site URL to the commit's and the repository's deployment views.
      - name: Record the deployment
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<JSON
          {"ref": "$SHA", "environment": "$ENVIRONMENT", "production_environment": true,
           "auto_merge": false, "required_contexts": [],
           "description": "vinext Cloudflare Worker ($SCVAL_SPORT), by deploy-cloudflare.yml"}
          JSON
          )
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - >/dev/null <<JSON
          {"state": "success", "environment_url": "$SITE_URL", "auto_inactive": true,
           "description": "deployed $SHA"}
          JSON
          echo "recorded deployment $id for $SHA"

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        run: |
          {
            echo "### deploy-cloudflare ($SCVAL_SPORT)"
            echo ""
            echo "- commit: \`${{ steps.gate.outputs.sha }}\`"
            echo "- site: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
